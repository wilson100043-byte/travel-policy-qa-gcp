<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="查詢差旅報帳規定，每個回答都附上依據的條文。" />
    <title>差旅規定查詢</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header class="masthead">
      <div class="masthead-inner">
        <div class="masthead-title">
          <h1>差旅規定查詢</h1>
          <p>只引用目前生效的規定，每個回答都附上條文出處。</p>
        </div>
        <button id="clear-chat" class="ghost-button" type="button">清除對話</button>
      </div>
    </header>

    <main class="ledger">
      <div id="messages" class="entries" role="log" aria-live="polite" aria-relevant="additions text">
        <section id="welcome" class="welcome" aria-labelledby="welcome-heading">
          <h2 id="welcome-heading">想確認哪一條規定？</h2>
          <p>直接用一句話問，例如金額上限、送件期限或要附的單據。可以接著追問，系統會參考最近三輪對話。</p>
          <div class="scope" aria-label="查詢範圍">
            <span class="scope-label">查詢範圍</span>
            <ul>
              <li>差旅報帳基本規範</li>
              <li>交通與餐費規定</li>
              <li>住宿費規定（現行版）</li>
            </ul>
          </div>
          <div class="examples">
            <span class="scope-label">常見問題</span>
            <button class="example" type="button" data-question="現在出差住宿每晚最多可以報多少？">住宿每晚最多可以報多少？</button>
            <button class="example" type="button" data-question="出差結束後多久要送出報帳申請？">出差結束後多久要送出申請？</button>
            <button class="example" type="button" data-question="搭計程車需要附什麼資料？">搭計程車要附什麼資料？</button>
          </div>
        </section>
      </div>
    </main>

    <footer class="composer-bar">
      <div class="composer-inner">
        <div id="error" class="error-banner" role="alert" hidden></div>
        <form id="question-form" class="composer">
          <label class="composer-mark" for="question">問</label>
          <textarea id="question" name="question" rows="1" maxlength="1000" placeholder="輸入想確認的規定" required></textarea>
          <button id="send" class="send-button" type="submit"><span>送出</span></button>
        </form>
        <p class="composer-note">示範資料：規定內容為虛構。對話只留在這個頁面，重新整理後就會清除。</p>
      </div>
    </footer>
  </body>
</html>
