name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    # Standard GitHub-hosted runners are free on public repositories; private
    # repositories can bill after included minutes are exhausted.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Test offline
        env:
          AI_MODE: offline
        run: python -m pytest -q

  terraform:
    name: Terraform static checks
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.13.5"
      - name: Check formatting
        run: terraform fmt -check -recursive infra
      - name: Validate bootstrap without a backend
        run: |
          terraform -chdir=infra/bootstrap init -backend=false -input=false
          terraform -chdir=infra/bootstrap validate -no-color
      - name: Validate app without a backend
        run: |
          terraform -chdir=infra/app init -backend=false -input=false
          terraform -chdir=infra/app validate -no-color
